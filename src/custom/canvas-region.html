<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>标记区域 — 全屏</title>
  <style>
    @font-face { font-family: 'Mojang'; src: url('../../assets/fonts/Mojang-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: block; }
    @font-face { font-family: 'Unifont'; src: url('../../assets/fonts/unifont-15.1.04.otf') format('opentype'); font-weight: normal; font-style: normal; font-display: block; }
    :root { --bg: #0e1018; --border-mid: #2a2a3a; --border-light: #505068; --text: #eeeeee; --title: #55ff55; --accent: #6699cc; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Unifont','Microsoft YaHei',sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
    .titlebar { height: 40px; background: rgba(14,16,24,0.95); display: flex; align-items: center; padding: 0 16px; -webkit-app-region: drag; border-bottom: 1px solid var(--border-light); flex-shrink: 0; }
    .titlebar .title { font-size: 14px; color: var(--title); flex: 1; }
    .titlebar .close-btn { -webkit-app-region: no-drag; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #888; font-size: 20px; border-radius: 4px; }
    .titlebar .close-btn:hover { background: #e94560; color: #fff; }
    .toolbar { height: 44px; background: rgba(14,16,24,0.9); display: flex; align-items: center; padding: 0 16px; gap: 8px; border-bottom: 1px solid var(--border-mid); flex-shrink: 0; flex-wrap: nowrap; overflow-x: auto; }
    .sep { width: 1px; height: 24px; background: var(--border-mid); flex-shrink: 0; }
    .btn { padding: 6px 12px; border: 1px solid var(--border-mid); background: rgba(14,16,24,0.8); color: var(--text); font-family: inherit; font-size: 11px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
    .btn:hover { background: var(--border-mid); border-color: var(--accent); }
    .btn.primary { background: #1e641e; border-color: #2a8e2a; color: #fff; }
    .btn.primary:hover { background: #2a6e2a; }
    .btn.primary:disabled { background: #333; border-color: #555; color: #888; cursor: not-allowed; }
    .btn.active-region { background: rgba(100,200,255,0.2); border-color: #66ccff; color: #66ccff; }
    .btn.active-pixel { background: rgba(255,200,100,0.2); border-color: #ffcc66; color: #ffcc66; }
    .btn.done { background: rgba(100,200,100,0.2); border-color: #66cc66; color: #66cc66; opacity: 0.7; }
    select { background: rgba(14,16,24,0.8); color: var(--text); border: 1px solid var(--border-mid); padding: 4px 8px; font-family: inherit; font-size: 11px; border-radius: 3px; cursor: pointer; }
    select:hover { border-color: var(--accent); }
    .step-label { font-size: 10px; color: #666; padding: 2px 6px; background: rgba(255,255,255,0.05); border-radius: 3px; }
    .canvas-area { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 4px); position: relative; }
    #imageCanvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    #overlayCanvas { position: absolute; pointer-events: none; image-rendering: pixelated; }
    .statusbar { height: 24px; background: rgba(14,16,24,0.95); border-top: 1px solid var(--border-mid); display: flex; align-items: center; padding: 0 16px; font-size: 11px; color: #666688; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="title">🎯 标记区域 — 两步标记</span>
    <div class="close-btn" id="closeBtn">✕</div>
  </div>

  <div class="toolbar">
    <span class="step-label">① 框选区域</span>
    <button class="btn" id="regionLeftEyeBtn" title="框选左眼区域">◻ 左眼区域</button>
    <button class="btn" id="regionRightEyeBtn" title="框选右眼区域">◻ 右眼区域</button>
    <button class="btn" id="regionMouthBtn" title="框选嘴巴区域">◻ 嘴巴区域</button>
    <div class="sep"></div>
    <span class="step-label">② 标记像素</span>
    <button class="btn" id="pixelLeftEyeBtn" title="标记左眼像素">● 左眼像素</button>
    <button class="btn" id="pixelRightEyeBtn" title="标记右眼像素">● 右眼像素</button>
    <button class="btn" id="pixelMouthBtn" title="标记嘴巴像素">● 嘴巴像素</button>
    <div class="sep"></div>
    <button class="btn" id="clearBtn">🗑️ 清除</button>
    <div class="sep"></div>
    <label style="font-size:11px; color:#888899;">分辨率:</label>
    <select id="resolutionSelect">
      <option value="original">原始</option>
      <option value="32">32</option>
      <option value="48">48</option>
      <option value="64" selected>64</option>
      <option value="96">96</option>
      <option value="128">128</option>
    </select>
    <div style="flex:1;"></div>
    <span id="regionStatus" style="font-size:10px; color:#888899;"></span>
    <button class="btn primary" id="confirmBtn" disabled>✓ 确认并返回</button>
  </div>

  <div class="canvas-area" id="canvasArea">
    <canvas id="imageCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div class="statusbar">
    <span id="statusText">就绪 — 先框选区域，再标记像素</span>
  </div>

  <script src="canvas-region.js"></script>
</body>
</html>
